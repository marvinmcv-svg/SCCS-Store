<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sin conexión · SCCS Store</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --ink:#14142b; --ink2:#5c5c6b; --accent:#292963; --accentInk:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --ink:#f5f5f7; --ink2:#a1a1aa; --accent:#c7c7f5; --accentInk:#14143a; } }
  body { margin:0; min-height:100svh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; padding:24px; }
  main { max-width:360px; }
  img { width:56px; height:56px; border-radius:12px; background:#fff; }
  h1 { font-weight:500; letter-spacing:-.03em; font-size:34px; line-height:1.05; margin:24px 0 8px; }
  p { color:var(--ink2); line-height:1.5; margin:0; }
  button { margin-top:28px; height:52px; padding:0 28px; border:0; border-radius:999px; background:var(--accent); color:var(--accentInk); font:500 15px/1 inherit; font-family:inherit; }
</style>
</head>
<body>
<main>
  <img src="/brand/sccs-crest.jpg" alt="" />
  <h1>Sin conexión</h1>
  <p>Revise su conexión a internet. Su bolsa se guarda y estará aquí cuando vuelva.</p>
  <p style="margin-top:8px">You're offline. Your bag is saved.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
